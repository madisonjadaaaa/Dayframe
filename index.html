<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E7">
<link rel="manifest" href="manifest.json">
<title>Dayframe</title>
<style>
:root{--bg:#fff4f8;--card:#fffafd;--ink:#442632;--muted:#9a7180;--line:#f1ceda;--accent:#df6e9b;--accent2:#f7bfd3;--deep:#9d4166;--rose:#ffe2ec;--hot:#c84e7d}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top right,#ffe1ec 0,#fff4f8 34%,#fff8fb 100%);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:24px 18px 100px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}
h1{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",Georgia,serif;font-style:italic;font-size:38px;margin:0;font-weight:500}.date{color:var(--muted);font-size:13px}.leave{border:1px solid var(--accent2);background:#fff0f5;color:var(--deep);padding:9px 12px;border-radius:999px;font-size:13px}
.progress{height:5px;background:#f2dbe3;border-radius:10px;overflow:hidden;margin:18px 0 24px}.progress i{display:block;height:100%;background:var(--accent);width:0}
.timeline{position:relative}.item{display:grid;grid-template-columns:70px 1fr;gap:12px;margin:0 0 12px}.time{font-size:12px;color:var(--muted);padding-top:18px;text-align:right}
.card{background:linear-gradient(145deg,#fffafd,#fff6fa);border:1px solid var(--line);border-radius:18px;padding:17px;cursor:pointer;box-shadow:0 3px 12px #00000008}.card.done{opacity:.55}.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px}.tag{display:inline-block;margin-top:10px;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffafdee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:42px;padding:12px 10px calc(12px + env(safe-area-inset-bottom))}
nav button,.plain{border:0;background:none;font:inherit;color:var(--muted);cursor:pointer}.active{color:var(--ink)!important;font-weight:700}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:5}.sheet{background:var(--bg);width:100%;max-width:720px;margin:auto;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;padding:22px 20px 38px}
.sheet h2{font-family:Georgia,serif;font-size:30px;font-weight:500;margin:6px 0}.close{float:right;border:0;background:none;font-size:24px}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.section h4{margin:0 0 8px}.check{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eee7dc}.check:last-child{border:0}.check input{width:18px;height:18px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;margin-top:8px}
.primary{width:100%;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--hot));color:white;font-weight:700;margin-top:12px}.timer{font-size:38px;font-variant-numeric:tabular-nums;margin:8px 0}
.exercise{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee7dc}.exercise img{width:150px;height:110px;object-fit:cover;border-radius:10px;background:#f6e3ea}
.small{font-size:12px;color:var(--muted)}.water{display:flex;gap:8px;flex-wrap:wrap}.cup{width:34px;height:42px;border:1px solid var(--line);border-radius:5px 5px 12px 12px;background:#fff}.cup.on{background:var(--accent)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;max-height:85vh}}

.monthHead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.monthHead button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:10px;color:var(--muted);padding:5px 0}
.day{min-height:62px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px;font-size:12px;cursor:pointer;position:relative}
.day.other{opacity:.35}.day.today{border:2px solid var(--accent)}.day.selected{background:#fce7ef}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:2px}
.fab{position:fixed;right:22px;bottom:78px;width:54px;height:54px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:28px;box-shadow:0 8px 22px #9c496b33;z-index:3}
.event{padding:11px 12px;background:#fceaf1;border-left:4px solid var(--accent);border-radius:10px;margin:8px 0}
.pill{display:inline-block;background:#f7d7e3;color:var(--deep);padding:5px 9px;border-radius:999px;font-size:11px;margin:3px}
.exercise img{border:1px solid var(--line)}

.sparkle{font-size:13px;letter-spacing:3px;color:var(--accent);margin-bottom:4px}
.hero{background:linear-gradient(135deg,#fff,#ffe8f1);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.hero b{font-family:Georgia,serif;font-size:20px}
.conflict{background:#fff0f4;border:1px dashed var(--accent);border-radius:12px;padding:10px;margin-top:8px;font-size:12px}
.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px;color:var(--ink)}
.studyCard{background:linear-gradient(145deg,#fff,#fff0f5);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.formVisual{width:100%;height:145px;border-radius:14px;background:#fff0f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.formVisual svg{width:100%;height:100%}.alarmRow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f4dce5}
.toggle{accent-color:var(--accent);width:20px;height:20px}

.script{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",Georgia,serif;font-style:italic;color:var(--deep)}
.iconTitle{display:flex;gap:9px;align-items:center}.iconTitle .emoji{font-size:23px}
.metricGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.metric b{font-size:20px;display:block}
.foodrow{display:grid;grid-template-columns:1fr 75px 80px;gap:7px;align-items:center;margin:8px 0}.foodrow input,.foodrow select{margin:0;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.bookbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 5px;font-size:11px;color:var(--ink)}
.journalEntry{background:linear-gradient(145deg,#fff,#fff1f6);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.day .mini{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin:10px 0}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:4px}
</style>
</head>
<body><div class="app">
<div class="top"><div><div class="sparkle">✦ ♡ ✦</div><div class="date" id="date"></div><h1>Dayframe</h1></div><div class="leave">Leave · 7:20 AM</div></div>
<div class="progress"><i id="bar"></i></div>
<div id="view"></div>
</div>
<button class="fab" onclick="openAdd()">＋</button><nav style="gap:12px"><button class="active" onclick="showToday(this)">Today</button><button onclick="showCalendar(this)">Calendar</button><button onclick="showBible(this)">Bible</button><button onclick="showFood(this)">Circle</button><button onclick="showCookbookPage(this)">Cookbook</button><button onclick="showGirlJournal(this)">Journal</button><button onclick="showReset(this)">Reset</button><button onclick="showSettings(this)">⚙︎</button></nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="detail"></div></div></div>
<script>
const todayKey=()=>new Date().toISOString().slice(0,10);
const state=JSON.parse(localStorage.getItem('dayframe')||'{}'); state.done=state.done||{}; state.notes=state.notes||{}; state.water=state.water||0;
state.events=state.events||[];
state.events=state.events.map((e,i)=>({...e,id:e.id||('legacy_'+i+'_'+String(e.date||'').replaceAll('-',''))}));
state.study=state.study||{book:"Ephesians",start:"Ephesians 1:1-14",weeks:2,framework:"Deep SOAP+",customTopic:"",mode:"passage",anchor:todayKey()};
state.study.mode=state.study.mode||"passage";state.study.anchor=state.study.anchor||todayKey();
state.study.overrides=state.study.overrides||{};
state.study.days=state.study.days||14;
state.journal=state.journal||[];
state.girlJournal=state.girlJournal||[];
state.foodlog=state.foodlog||{};
state.stepGoal=state.stepGoal||10000;
state.circle=state.circle||{calorieTarget:0,proteinTarget:0,manualSteps:0};
state.recipes=state.recipes||[];
state.manualMacros=state.manualMacros||{};
state.alarms=state.alarms||{"wake1":true,"wake2":true,"word":true,"workout":true,"leave":true};
const save=()=>localStorage.setItem('dayframe',JSON.stringify(state));
const weekday=new Date().getDay();
const workouts={
1:{name:"Lower Body + Cardio",mins:40,items:[["Goblet squat","3 × 10"],["Romanian deadlift","3 × 10"],["Step-ups","3 × 10/leg"],["Hip abduction","3 × 15"],["Incline walk","10 min"]]},
2:{name:"Upper Body + Core",mins:40,items:[["Lat pulldown","3 × 10"],["Seated row","3 × 10"],["Shoulder press","3 × 10"],["Triceps pressdown","3 × 12"],["Dead bug","3 × 8/side"],["Brisk walk","8 min"]]},
3:{name:"Cardio + Mobility",mins:30,items:[["Brisk incline walk or elliptical","20 min"],["Hip mobility","5 min"],["Upper-body mobility","5 min"]]},
4:{name:"Lower Body + Glutes",mins:40,items:[["Hip thrust","3 × 10"],["Leg press","3 × 10"],["Reverse lunge","3 × 8/leg"],["Cable kickback","3 × 12/leg"],["Incline walk","8 min"]]},
5:{name:"Upper Body + Cardio",mins:40,items:[["Chest press","3 × 10"],["Lat pulldown","3 × 10"],["Lateral raise","3 × 12"],["Biceps curl","3 × 12"],["Triceps pressdown","3 × 12"],["Cardio","10 min"]]},
6:{name:"Long Walk + Optional Strength",mins:45,items:[["Walk","30–45 min"],["Optional glute circuit","2 rounds"]]},
0:{name:"Rest + Recovery",mins:0,items:[["Easy walk / stretch","Optional"]]}
};
const schedule=[
["4:30","First Alarm","Gentle wake-up alarm","alarm1"],
["4:40","Second Alarm","Time to actually wake up","alarm2"],
["4:45","Wake + Water","Feet on floor · start the day","wake"],
["4:50","Word + Prayer","Guided deep study","word"],
["5:25","Workout",workouts[weekday].name,"workout"],
["6:05","Get Ready","Shower · hair · makeup · dress","ready"],
["7:05","Breakfast + Coffee","Eat, hydrate, final check","breakfast"],
["7:20","Leave","Out the door","leave"],
["6:15 PM","Home Reset","Shower · dinner · 15 min rest","home"],
["7:15 PM","School Focus","60-minute homework block","school"],
["8:30 PM","Tomorrow Prep","Pack + prep + wind down","night"],
["9:15 PM","Bed Routine","Protect tomorrow morning","bed"]
];
function setNav(btn){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}

function workoutForDate(key){let d=new Date(key+'T12:00');return workouts[d.getDay()]}
function baseScheduleForDate(key){
 let d=new Date(key+'T12:00'), dow=d.getDay(), w=workoutForDate(key);
 if(dow===6)return [
 ["7:30","Wake + Water","Slow Saturday start","wake"],["7:45","♡ Word + Prayer",studyForDate(key).passage+" · "+studyForDate(key).title,"word"],
 ["8:30","♡ Breakfast","Breakfast + coffee","breakfast"],["9:00","✦ Deep School Block","Studio / coursework · 3 hours","school"],
 ["12:00 PM","Lunch + Reset","Eat + 45-minute break","home"],["1:00 PM","✦ Deep School Block II","Studio / coursework · 3 hours","school2"],
 ["4:00 PM","✦ Free Time","Saturday work is done unless a deadline requires otherwise","free"],["9:30 PM","☾ Wind Down","Prep for Sunday + rest","night"]];
 if(dow===0)return [
 ["6:00","Wake + Get Ready","Church morning","wake"],["7:00","♡ Church","Blocked through 12:30 PM","church"],
 ["1:00 PM","Lunch + Rest","Decompress","home"],["1:45 PM","♡ Sunday Reset","Meal prep · outfits · bags · calendar","reset"],
 ["3:45 PM","♡ Food Plan","Choose meals + preview macros","food"],["4:15 PM","✦ Week Preview","School deadlines + church + plans","calendar"],
 ["5:00 PM","♡ Light School Planning","Plan deliverables, no giant production block","school"],["6:30 PM","♡ Rest","Protect the evening","free"],["9:00 PM","☾ Bed Routine","Early night","bed"]];
 return [
 ["4:30","· First Alarm","Gentle wake-up alarm","alarm1"],["4:40","· Second Alarm","Time to actually wake up","alarm2"],["4:45","· Wake + Water","Feet on floor · start the day","wake"],
 ["4:50","♡ Word + Prayer",studyForDate(key).passage+" · "+studyForDate(key).title,"word"],["5:25","✦ Workout",w.name+" · "+w.mins+" min","workout"],
 ["6:05","♡ Get Ready","Shower · hair · makeup · dress","ready"],["7:05","♡ Breakfast + Coffee","Eat · hydrate · final check","breakfast"],["7:20","→ Leave","Out the door","leave"],
 ["6:15 PM","♡ Home Reset","Shower · dinner · 15 min rest","home"],["7:15 PM","✦ School Focus","60-minute homework block","school"],
 ["8:30 PM","🎀 Tomorrow Prep","Pack + prep + wind down","night"],["9:15 PM","☾ Bed Routine","Protect tomorrow morning","bed"]];
}
function showToday(btn){if(btn)setNav(btn);document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
let sched=baseScheduleForDate(todayKey()),custom=state.events.filter(e=>e.date===todayKey());
let hasEvening=custom.some(e=>toMinutes(e.time)>=17*60);
let routine=sched.map(([t,n,sub,id])=>`<div class="item"><div class="time">${t}</div><div class="card ${state.done[todayKey()+id]?'done':''}" onclick="${id==='food'?'showFood()':id==='calendar'?'showCalendar()':`openItem('${id}')`}"><h3>${state.done[todayKey()+id]?'✓ ':''}${n}</h3><p>${sub}</p>${hasEvening&&['home','school','night'].includes(id)?'<div class="conflict">♡ You have an evening plan today. Review the added event below and adjust this block if needed.</div>':''}<span class="tag">${state.done[todayKey()+id]?'Complete':'Open'}</span></div></div>`).join('');
let added=custom.map(e=>{let idx=state.events.indexOf(e);return `<div class="item"><div class="time">${e.time||'Plan'}</div><div class="card" onclick="editEventIndex(${idx})"><h3>♡ ${e.title}</h3><p>${e.type||'Calendar item'}</p><span class="tag">Tap to edit / delete</span></div></div>`}).join('');
document.getElementById('view').innerHTML=`<div class="hero"><div class="sparkle">♡ ✦ ♡</div><div class="small">TODAY AT A GLANCE</div><b class="script">${new Date().getDay()===6?'Saturday studio rhythm':new Date().getDay()===0?'Sunday reset rhythm':'Your weekday rhythm'}</b><p class="small">${custom.length?custom.length+' added plan'+(custom.length>1?'s':'')+' woven into today.':'Your regular schedule is ready.'}</p></div><div class="timeline">${routine}${added}</div><button class="primary" onclick="openAdd()">＋ Add something to today</button>`;updateBar()}
function updateBar(){let sc=baseScheduleForDate(todayKey()),d=sc.filter(x=>state.done[todayKey()+x[3]]).length;document.getElementById('bar').style.width=(d/sc.length*100)+'%'}
function complete(id){state.done[todayKey()+id]=true;save();closeModal();showToday()}
function openItem(id){let html='';
if(id==='word') html=`<div class="small">WORD + PRAYER · 35 MIN</div><h2>Today's Study</h2>
<div class="section"><h4>Passage</h4><b>${studyForDate(todayKey()).passage}</b><p class="small">${studyForDate(todayKey()).focus} Read slowly twice; mark repeated ideas, contrasts, commands, promises and questions.</p></div>
<div class="section"><h4>Historical context</h4><p>${currentContext()}</p></div>
<div class="section"><h4>Word study</h4><p>${currentBookName()==='Ephesians'?'<b>Wisdom — sophia:</b> wisdom or insight.<br><b>Knowledge — epignōsis:</b> fuller or experiential knowledge.<br><b>Enlightened — phōtizō:</b> to illuminate or bring to light.':'Use this space to record key repeated words from today’s passage. Dayframe keeps word-study prompts tied to the selected passage rather than carrying terms over from another book.'}</p></div>
<div class="section"><h4>Observe</h4><textarea id="note1" placeholder="What do I see in the passage?">${state.notes[todayKey()+'word']||''}</textarea></div>
<div class="section"><h4>Apply</h4><textarea placeholder="What am I believing, changing, or acting on today?"></textarea></div>
<div class="section"><h4>Pray</h4><div class="check"><input type="checkbox"> Pray Ephesians 1:17–19 personally</div><div class="check"><input type="checkbox"> Thanksgiving / worship</div><div class="check"><input type="checkbox"> Pray in the Spirit</div></div>
<button class="primary" onclick="saveWord()">Complete Word + Prayer</button>`;
else if(id==='workout'){let w=workoutForDate(todayKey());html=`<div class="small">TODAY'S TRAINING</div><h2>${w.name}</h2><p>${w.mins?`${w.mins} minutes · fat-loss support + strength/body composition`:'Recovery day'}</p><div class="section">${w.items.map((x,i)=>`<div class="exercise" style="grid-template-columns:42px 1fr"><div style="width:38px;height:38px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;color:var(--deep);font-weight:700">${i+1}</div><div><b>${x[0]}</b><br><span class="small">${x[1]} · ${formCue(x[0])}</span></div></div>`).join('')}</div>${w.mins?`<div class="section"><h4>Workout timer</h4><div class="timer" id="timer">${w.mins}:00</div><button class="primary" onclick="startTimer(${w.mins*60})">Start Timer</button></div>`:''}<p class="small">Fat loss occurs across the body rather than from one specific area. This plan combines activity and resistance training to support overall fat loss while building muscle.</p><button class="primary" onclick="complete('workout')">Complete Workout</button>`}
else if(id==='ready') html=checkPage("Get Ready",["Shower","Deodorant","Skincare + lotion","Hair","Makeup","Get dressed","Wallet","Keys","Gum","Makeup bag","Lotion","Lunch","Water bottle","Phone + charger"],id);
else if(id==='breakfast') html=checkPage("Breakfast + Coffee",["Eat breakfast","Make coffee","Fill water bottle","Take packed lunch/snacks","Final bathroom check"],id);
else if(id==='night') html=checkPage("Tomorrow Prep",["Lunch packed","Breakfast ready","Water bottle clean","Work bag packed","Wallet + keys in place","Outfit ready","Shoes/accessories ready","Hair prepped","Check tomorrow's church/school commitments","Phone charging","Alarm set"],id);
else if(id==='school') html=`<div class="small">SCHOOL · 60 MIN</div><h2>Focused Work Block</h2><div class="section"><h4>One outcome for tonight</h4><input type="text" id="schooltask" placeholder="Ex: Finish precedent diagram"><p class="small">Choose one concrete deliverable—not “work on studio.”</p></div><div class="section"><h4>Focus timer</h4><div class="timer" id="timer">60:00</div><button class="primary" onclick="startTimer(3600)">Start 60 Minutes</button></div><button class="primary" onclick="complete('school')">Complete School Block</button>`;
else if(id==='home') html=checkPage("Home Reset",["Shower","Eat dinner","Refill water","15-minute no-work rest","Set up school workspace"],id);
else html=`<h2>${baseScheduleForDate(todayKey()).find(x=>x[3]===id)?.[1]||id}</h2><div class="section"><p>${baseScheduleForDate(todayKey()).find(x=>x[3]===id)?.[2]||''}</p></div><button class="primary" onclick="complete('${id}')">Mark Complete</button>`;
document.getElementById('detail').innerHTML=html;document.getElementById('modal').style.display='flex'}
function checkPage(title,items,id){return `<h2>${title}</h2><div class="section">${items.map(x=>`<label class="check"><input type="checkbox"> ${x}</label>`).join('')}</div><button class="primary" onclick="complete('${id}')">Complete</button>`}
function saveWord(){let n=document.getElementById('note1');if(n){state.notes[todayKey()+'word']=n.value;if(n.value.trim())state.journal.push({date:todayKey(),passage:studyForDate(todayKey()).passage,note:n.value.trim()})}save();complete('word')}
let interval; function startTimer(sec){clearInterval(interval);let el=document.getElementById('timer');interval=setInterval(()=>{sec--;let m=Math.floor(sec/60),s=sec%60;el.textContent=m+':'+String(s).padStart(2,'0');if(sec<=0){clearInterval(interval);alert("Time's up — move to the next block.");}},1000)}
function closeModal(){document.getElementById('modal').style.display='none';clearInterval(interval)}


function toMinutes(t){
 if(!t)return -1; let m=t.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i); if(!m)return -1;
 let h=+m[1],min=+(m[2]||0),ap=(m[3]||'').toUpperCase(); if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;return h*60+min;
}
const ephPlan=[
["Ephesians 1:1–14","Chosen, adopted, redeemed","Identity and every spiritual blessing in Christ."],
["Ephesians 1:15–23","Eyes of the heart","Wisdom, revelation, hope, inheritance and power."],
["Ephesians 2:1–10","Made alive","Grace, salvation and God's workmanship."],
["Ephesians 2:11–22","Brought near","Reconciliation, peace and belonging."],
["Ephesians 3:1–13","The mystery revealed","Paul's stewardship and the inclusion of the Gentiles."],
["Ephesians 3:14–21","Rooted in love","Strength in the inner person and knowing Christ's love."],
["Ephesians 4:1–16","Walk worthy","Unity, maturity and the gifts Christ gives."],
["Ephesians 4:17–32","Put on the new self","Renewed thinking, speech, conduct and forgiveness."],
["Ephesians 5:1–20","Walk in love and light","Imitating God, wisdom and being filled with the Spirit."],
["Ephesians 5:21–33","Love and submission","Household instruction in its first-century letter context."],
["Ephesians 6:1–9","Faithfulness in the household","Children, parents, bondservants and masters in the ancient household setting."],
["Ephesians 6:10–20","Armor of God","Standing firm, prayer and spiritual resistance."]
];
const genesisPlan=[
["Genesis 1","Creation","God creates and orders the heavens, earth and living creatures; humanity bears God's image."],
["Genesis 2","Garden and humanity","The narrative focuses on humanity, vocation, the garden and marriage."],
["Genesis 3","The fall","Human disobedience brings shame, fracture and exile from Eden."],
["Genesis 4","Cain and Abel","Worship, jealousy, violence and the spread of human culture."],
["Genesis 6","Noah and the flood","Human violence, divine judgment and Noah's preservation."],
["Genesis 12","Abram's call","God calls Abram and introduces promises of land, descendants and blessing."],
["Genesis 15","Covenant with Abram","God formalizes covenant promises with Abram."],
["Genesis 22","Abraham and Isaac","Abraham is tested and God's promise is reaffirmed."],
["Genesis 28","Jacob at Bethel","Jacob encounters God and receives the ancestral promise."],
["Genesis 37","Joseph's story begins","Joseph's dreams and family conflict lead to his sale into Egypt."],
["Genesis 45","Joseph reveals himself","Joseph interprets his story through providence and reconciles with his brothers."],
["Genesis 50","Providence and ending","Joseph names God's redemptive purpose within human evil as Genesis closes."]

 document.getElementById('view').innerHTML=`<div class="hero"><div class="sparkle">♡ ✦ ♡</div><div class="small">THE CIRCLE</div><b class="script">Nourish · move · repeat</b><p class="small">A simple daily dashboard for the targets you choose.</p></div>
 <div class="metricGrid"><div class="metric"><span class="small">Calories eaten</span><b>${Math.round(tot[0])}</b><span class="small">${calLeft!==null?Math.round(calLeft)+' remaining':'set a target below'}</span></div><div class="metric"><span class="small">Protein eaten</span><b>${Math.round(tot[1])}g</b><span class="small">${proteinLeft!==null?Math.round(proteinLeft)+'g remaining':'set a target below'}</span></div><div class="metric"><span class="small">Steps logged</span><b>${actual.toLocaleString()}</b><span class="small">${remain.toLocaleString()} remaining</span></div><div class="metric"><span class="small">Workout movement</span><b>~${estSteps.toLocaleString()}</b><span class="small">rough step equivalent</span></div></div>
 <div class="section"><h4>Your daily targets</h4><input id="ctarget" type="text" value="${state.circle.calorieTarget||''}" placeholder="Calorie target you want to use"><input id="ptarget" type="text" value="${state.circle.proteinTarget||''}" placeholder="Protein target (g)"><input id="stepsactual" type="text" value="${actual||''}" placeholder="Current steps from phone/watch"><button class="primary" onclick="saveCircleTargets()">Update Circle</button></div>
 <div class="section"><h4>Quick macro entry</h4><p class="small">Already know the label? Enter it directly—your protein and calories update immediately.</p><input id="mname" type="text" placeholder="Food / meal, e.g. yogurt bowl"><input id="mcal" type="text" placeholder="Calories"><input id="mprotein" type="text" placeholder="Protein (g)"><button class="primary" onclick="addManualMacro()">Add to Today</button>${manual.map((x,i)=>`<div class="check"><span>${x.name} · ${x.protein||0}g protein · ${x.calories||0} cal</span><button class="plain" onclick="removeManualMacro(${i})">×</button></div>`).join('')}</div>
 <div class="section"><h4>Ingredient log</h4><select id="foodname" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px">${Object.keys(foods).map(f=>`<option>${f}</option>`).join('')}</select><input id="foodgrams" type="text" placeholder="grams eaten, e.g. 120"><button class="primary" onclick="addFood()">Add Ingredient</button>${log.map((x,i)=>`<div class="check"><span>${x.grams}g ${x.name}</span><button class="plain" onclick="removeFood(${i})">×</button></div>`).join('')}</div>
 <div class="section"><h4>Workout estimate</h4><p><b>${w.name}</b> · ${w.mins} min</p><p class="small">Dayframe can estimate movement volume, but calories burned vary substantially by body size, intensity, conditioning and equipment. For a useful burn estimate, use the value reported by your watch/cardio machine and log it alongside your day rather than treating a generic formula as exact.</p></div>
 <button class="primary" onclick="showCookbook()">Open Our Cookbook ♡</button>`;
}
function addManualMacro(){let name=document.getElementById('mname').value.trim()||'Food',cal=parseFloat(document.getElementById('mcal').value)||0,protein=parseFloat(document.getElementById('mprotein').value)||0;state.manualMacros[todayKey()]=state.manualMacros[todayKey()]||[];state.manualMacros[todayKey()].push({name,calories:cal,protein});save();showFood()}
function removeManualMacro(i){state.manualMacros[todayKey()].splice(i,1);save();showFood()}
function saveCircleTargets(){state.circle.calorieTarget=parseFloat(document.getElementById('ctarget').value)||0;state.circle.proteinTarget=parseFloat(document.getElementById('ptarget').value)||0;state.circle.manualSteps=parseInt(document.getElementById('stepsactual').value)||0;save();showFood()}
function macroTotals(log){return log.reduce((a,x)=>{let f=foods[x.name]||[0,0,0,0],q=x.grams/100;return a.map((v,i)=>v+f[i]*q)},[0,0,0,0])}
function addFood(){let name=document.getElementById('foodname').value,g=parseFloat(document.getElementById('foodgrams').value);if(!g||g<0)return;state.foodlog[todayKey()]=state.foodlog[todayKey()]||[];state.foodlog[todayKey()].push({name,grams:g});save();showFood()}
function removeFood(i){state.foodlog[todayKey()].splice(i,1);save();showFood()}
function workoutSteps(w){if(!w.mins)return 0;if(w.name.includes("Cardio"))return 3500;if(w.name.includes("Walk"))return 5000;if(w.name.includes("Upper"))return 1800;return 1500}
function showCookbookPage(btn){
 if(btn)setNav(btn);
 document.getElementById('view').innerHTML=`<div class="hero"><div class="sparkle">♡ ✦ ♡</div><div class="small">OUR COOKBOOK</div><b class="script">Things I actually make</b><p class="small">Keep your recipes here, separate from daily tracking.</p></div><button class="primary" onclick="showCookbook()">＋ Add a Recipe</button>${state.recipes.length?state.recipes.map((r,i)=>`<div class="studyCard" onclick="editRecipePage(${i})"><b class="script">${r.name}</b><p class="small">${r.ingredients.replace(/\\n/g,' · ')}</p><span class="small">${r.serving||''} · tap to edit / delete</span></div>`).join(''):'<div class="section"><p>No recipes yet. Add the first thing you actually make.</p></div>'}`;
}
function editRecipePage(i){let r=state.recipes[i];document.getElementById('detail').innerHTML=`<div class="small">EDIT RECIPE</div><h2 class="script">${r.name}</h2><div class="section"><input id="rname2" type="text" value="${r.name.replace(/"/g,'&quot;')}"><textarea id="ring2" rows="7">${r.ingredients}</textarea><input id="rserv2" type="text" value="${(r.serving||'').replace(/"/g,'&quot;')}"></div><button class="primary" onclick="updateRecipePage(${i})">Save Changes</button><button class="primary" style="background:#fff;color:var(--deep);border:1px solid var(--line)" onclick="deleteRecipePage(${i})">Delete Recipe</button>`;document.getElementById('modal').style.display='flex'}
function updateRecipePage(i){state.recipes[i]={name:document.getElementById('rname2').value,ingredients:document.getElementById('ring2').value,serving:document.getElementById('rserv2').value};save();closeModal();showCookbookPage()}
function deleteRecipePage(i){state.recipes.splice(i,1);save();closeModal();showCookbookPage()}
function showCookbook(){
 document.getElementById('detail').innerHTML=`<div class="small">OUR COOKBOOK</div><h2 class="script">Recipes I actually like ♡</h2><div class="section"><input id="rname" type="text" placeholder="Recipe name"><textarea id="ring" rows="5" placeholder="Ingredients + amounts&#10;Example: 120g chicken, 150g rice, 50g avocado"></textarea><input id="rserv" type="text" placeholder="Serving / portion notes"><button class="primary" onclick="saveRecipe()">Save Recipe</button></div>${state.recipes.map((r,i)=>`<div class="studyCard" onclick="editRecipe(${i})"><b>${r.name}</b><p class="small">${r.ingredients.replace(/\n/g,' · ')}</p><span class="small">tap to edit</span></div>`).join('')}<div class="section"><p class="small">Cookbook stores your recipes. The Circle is where daily intake and remaining targets are tracked. Automatic recipe macros require either ingredients that match Dayframe's nutrition table or a connected nutrition database.</p></div>`;
 document.getElementById('modal').style.display='flex'
}
function saveRecipe(){let n=document.getElementById('rname').value.trim(),ing=document.getElementById('ring').value.trim();if(!n)return;state.recipes.push({name:n,ingredients:ing,serving:document.getElementById('rserv').value});save();closeModal();showCookbookPage()}
function editRecipe(i){let r=state.recipes[i];document.getElementById('detail').innerHTML=`<div class="small">EDIT RECIPE</div><h2 class="script">${r.name}</h2><div class="section"><input id="rname2" type="text" value="${r.name.replace(/"/g,'&quot;')}"><textarea id="ring2" rows="7">${r.ingredients}</textarea><input id="rserv2" type="text" value="${(r.serving||'').replace(/"/g,'&quot;')}"></div><button class="primary" onclick="updateRecipe(${i})">Save Changes</button><button class="primary" style="background:#fff;color:var(--deep);border:1px solid var(--line)" onclick="deleteRecipe(${i})">Delete Recipe</button>`}
function updateRecipe(i){state.recipes[i]={name:document.getElementById('rname2').value,ingredients:document.getElementById('ring2').value,serving:document.getElementById('rserv2').value};save();showCookbook()}
function deleteRecipe(i){state.recipes.splice(i,1);save();showCookbook()}
function showGirlJournal(btn){
 if(btn)setNav(btn);document.getElementById('view').innerHTML=`<div class="hero"><div class="sparkle">♡ 🎀 ✎</div><div class="small">PERSONAL JOURNAL</div><b class="script">A little space for me</b><p class="small">Separate from your Bible-study notes.</p></div><div class="section"><h4>How are you doing today?</h4><input id="jtitle" type="text" placeholder="Title / thought"><textarea id="jbody" rows="7" placeholder="Write whatever is on your mind..."></textarea><button class="primary" onclick="saveGirlJournal()">Save Entry ♡</button></div>${state.girlJournal.map((j,i)=>({...j,_i:i})).reverse().map(j=>`<div class="journalEntry" onclick="editGirlJournal(${j._i})"><div class="small">${j.date} · tap to edit</div><b class="script">${j.title||'Journal entry'}</b><p>${j.body.replace(/</g,'&lt;')}</p></div>`).join('')}`;
}

function editGirlJournal(i){let j=state.girlJournal[i];if(!j)return;document.getElementById('detail').innerHTML=`<div class="small">EDIT JOURNAL ENTRY</div><h2 class="script">Your thoughts ♡</h2><div class="section"><input id="jtitle2" type="text" value="${(j.title||'').replace(/"/g,'&quot;')}"><textarea id="jbody2" rows="9">${j.body.replace(/</g,'&lt;')}</textarea></div><button class="primary" onclick="updateGirlJournal(${i})">Save Changes</button><button class="primary" style="background:#fff;color:var(--deep);border:1px solid var(--line)" onclick="deleteGirlJournal(${i})">Delete Entry</button>`;document.getElementById('modal').style.display='flex'}
function updateGirlJournal(i){state.girlJournal[i].title=document.getElementById('jtitle2').value;state.girlJournal[i].body=document.getElementById('jbody2').value;save();closeModal();showGirlJournal()}
function deleteGirlJournal(i){state.girlJournal.splice(i,1);save();closeModal();showGirlJournal()}
function saveGirlJournal(){let body=document.getElementById('jbody').value.trim();if(!body)return;state.girlJournal.push({date:new Date().toLocaleDateString(),title:document.getElementById('jtitle').value.trim(),body});save();showGirlJournal()}
